name: Release SelfSync plugin

# "We can't be not releasing code" (D0035). The version lives in manifest.json; the release is published
# AUTOMATICALLY when a bumped manifest.json lands on main — no separate "remember to tag + push" step (the
# gap that put 1.9.0 on main but not into a GitHub release, so BRAT still showed 1.8.1). This job derives
# the version from manifest.json, and is IDEMPOTENT: if that version is already released it no-ops, so a
# re-run, a manual re-push, or an unrelated manifest edit is safe. `gh release create` creates the matching
# tag (X.Y.Z, no "v" — matching manifest.json) and uploads the assets BRAT installs. workflow_dispatch is
# the manual re-run escape hatch. verify-released.yml remains the daily backstop.
on:
  push:
    branches: [main]
    paths:
      - manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Determine version and whether it is already released
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(node -p "require('./manifest.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if gh release view "$VER" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version $VER is already released — nothing to do."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "version $VER is not released yet — will build + publish."
          fi

      - name: Build the plugin
        if: steps.v.outputs.released == 'false'
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Publish release with plugin assets
        if: steps.v.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.v.outputs.version }}"
          # Create the tag (at this commit) AND the release in one step; manifest.json's version IS the tag.
          # BRAT downloads these assets from the release.
          # SR-50 (issueReleaseAssetIntegrityUnchecked): record the SHA-256 of EVERY asset at publish time, as a
          # SHA256SUMS asset AND in the release notes, so the published files can be re-verified against the build
          # (scripts/check-release.mjs does, daily via verify-released.yml; the plugin's About row shows the digest
          # of the installed main.js for a device-side audit). Basenames only, so `sha256sum -c` works in a flat dir.
          (cd client && sha256sum main.js styles.css) > SHA256SUMS
          sha256sum manifest.json versions.json >> SHA256SUMS
          cat SHA256SUMS
          NOTES="$(printf 'SelfSync %s — install via BRAT: add the repo williamweatherholtz/obsidian-selfsync.\n\nSHA-256 of the published assets (also the SHA256SUMS asset):\n\n```\n%s\n```' "$VER" "$(cat SHA256SUMS)")"
          gh release create "$VER" --target "$GITHUB_SHA" \
            client/main.js client/styles.css manifest.json versions.json SHA256SUMS \
            --title "$VER" \
            --notes "$NOTES"

      # SR-50: what GitHub now SERVES must be what we just built — download the published assets back and verify
      # them against SHA256SUMS. A mismatch fails the job loudly (the release stays visible, red, for the operator
      # to delete + re-run) instead of an altered/corrupted asset installing silently through BRAT.
      - name: Verify the published assets against SHA256SUMS
        if: steps.v.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.v.outputs.version }}"
          rm -rf verify && mkdir verify
          for attempt in 1 2 3 4 5; do
            if gh release download "$VER" --dir verify --clobber; then break; fi
            echo "assets not yet downloadable (attempt $attempt) — retrying"; sleep 10
          done
          cd verify && ls -l && sha256sum -c SHA256SUMS

  # The server image is published by a dedicated workflow (.github/workflows/server-image.yml), which
  # fires on server changes to main (and on version tags) — so a release that touches the server publishes
  # the matching image independently of this job.
