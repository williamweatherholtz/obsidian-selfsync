name: Publish server image

# Build + push the self-hostable server image to GHCR so deploy/docker-compose*.yml can `image:` it.
# Runs on demand, on server changes to main (→ :latest), and on a VERSION ref — but a tag created by release.yml under
# GITHUB_TOKEN never triggers a workflow (GitHub rule), so release.yml DISPATCHES this workflow on the new tag ref
# (`gh workflow run server-image.yml --ref X.Y.Z`); that dispatch is what produces the version-tagged image
# docs/deployment.md tells operators to pin. Tags: the git ref + `latest`.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server-image.yml"
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  packages: write

jobs:
  server-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-server" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker tags
        id: tags
        run: |
          name="${{ steps.img.outputs.name }}"
          tags="$name:latest"
          # On a version tag, also tag the image with that version.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tags="$tags"$'\n'"$name:${GITHUB_REF#refs/tags/}"
          fi
          { echo "list<<EOF"; echo "$tags"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./server
          push: true
          # linux/amd64 only for now: the Rust build under QEMU arm64 emulation is prohibitively slow.
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.list }}
