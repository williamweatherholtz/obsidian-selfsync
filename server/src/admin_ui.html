<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SelfSync Admin</title>
<style>
  :root {
    --bg: #0f1220; --panel: #181c2e; --line: #2a3050; --ink: #e7e9f3; --muted: #9aa0bd;
    --accent: #6ea8fe; --good: #4ade80; --warn: #fbbf24; --bad: #f87171; --chip: #232842;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent); }
  .wrap { max-width: 860px; margin: 0 auto; padding: 24px 18px 64px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .2px; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
    margin: 26px 0 10px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding-bottom: 14px; border-bottom: 1px solid var(--line); }
  .who { font-size: 13px; color: var(--muted); }
  .badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px;
    background: var(--chip); color: var(--accent); margin-left: 6px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; margin-top: 10px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input, select, button { font: inherit; }
  input, select { background: #0d1020; color: var(--ink); border: 1px solid var(--line);
    border-radius: 7px; padding: 7px 9px; }
  input::placeholder { color: #5b6180; }
  button { background: var(--accent); color: #06122e; border: 0; border-radius: 7px;
    padding: 7px 12px; font-weight: 600; cursor: pointer; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 500; }
  button.danger { background: transparent; color: var(--bad); border: 1px solid var(--line); font-weight: 500; }
  button:disabled { opacity: .5; cursor: default; }
  table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); font-size: 14px; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  .vault { font-weight: 600; }
  .perm { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--chip); }
  .perm.readWrite { color: var(--warn); } .perm.read { color: var(--good); }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); font-size: 13px; padding: 6px 2px; }
  .msg { margin-top: 10px; font-size: 13px; min-height: 18px; }
  .msg.err { color: var(--bad); } .msg.ok { color: var(--good); }
  .token { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: #0d1020;
    border: 1px dashed var(--accent); border-radius: 7px; padding: 8px 10px; word-break: break-all; margin-top: 8px; }
  .card-title { display:flex; justify-content: space-between; align-items:center; }
  label.inline { font-size: 13px; color: var(--muted); }
  /* A real on/off toggle switch (D0037) — replaces the registration checkbox. */
  .switch { position: relative; display: inline-block; width: 44px; height: 24px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .slider { position: absolute; cursor: pointer; inset: 0; background: var(--line);
    border-radius: 999px; transition: .15s; }
  .switch .slider::before { content: ""; position: absolute; height: 18px; width: 18px; left: 3px;
    top: 3px; background: var(--ink); border-radius: 50%; transition: .15s; }
  .switch input:checked + .slider { background: var(--accent); }
  .switch input:checked + .slider::before { transform: translateX(20px); background: #06122e; }
  .lastused { font-size: 11px; color: var(--muted); font-weight: 400; margin-left: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>SelfSync <span class="muted">Admin</span></h1>
    <div class="who" id="who"></div>
  </div>
  <div id="app"></div>
  <div class="msg" id="msg"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let token = sessionStorage.getItem("selfsync_admin_token") || "";
let me = null;

function setMsg(text, kind) { const m = $("msg"); m.textContent = text || ""; m.className = "msg " + (kind || ""); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (token) opts.headers["Authorization"] = "Bearer " + token;
  if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  const r = await fetch(path, opts);
  if (!r.ok) { const t = await r.text().catch(() => ""); throw new Error(t || (r.status + "")); }
  const ct = r.headers.get("content-type") || "";
  return ct.includes("application/json") ? r.json() : r.text();
}

async function login(username, password, totp) {
  const body = { username, password };
  if (totp) body.totp = totp;
  const r = await api("POST", "/api/login", body);
  token = r.token; sessionStorage.setItem("selfsync_admin_token", token);
  // IA.3.5.9: an admin-created / password-reset account is flagged must-change. Its token is valid ONLY
  // for /api/password until a new password is set, so booting the dashboard would 403 and bounce with no
  // explanation. Present the forced-change form instead.
  if (r.must_change_password) { mustChangeView(); return; }
  await boot();
}

// IA.3.5.9: the forced-password-change screen — the one thing a must-change account's token can do.
function mustChangeView() {
  $("who").textContent = "";
  $("app").innerHTML = `
    <div class="panel" style="max-width:380px;margin-top:28px;">
      <h2 style="margin-top:0">Set a new password</h2>
      <div class="muted" style="font-size:13px;margin-bottom:8px">This account requires a new password before you can continue.</div>
      <div class="row"><input id="cpc" type="password" placeholder="current (temporary) password" style="flex:1" autofocus /></div>
      <div class="row" style="margin-top:8px"><input id="cpn" type="password" placeholder="new password" style="flex:1" /></div>
      <div class="row" style="margin-top:8px"><input id="cpn2" type="password" placeholder="confirm new password" style="flex:1" /></div>
      <div class="row" style="margin-top:12px"><button id="cpgo">Set password &amp; continue</button></div>
    </div>`;
  const submit = async () => {
    const cur = $("cpc").value, nw = $("cpn").value, nw2 = $("cpn2").value;
    if (nw !== nw2) { setMsg("The new passwords don't match.", "err"); return; }
    try {
      setMsg("");
      const r = await api("POST", "/api/password", { current: cur, new_password: nw });
      // Success re-issues a fresh token and revokes all other sessions; the must-change flag is cleared.
      token = r.token; sessionStorage.setItem("selfsync_admin_token", token);
      setMsg("Password updated.", "ok");
      await boot();
    } catch (e) { setMsg("Couldn't set password: " + e.message, "err"); }
  };
  $("cpgo").onclick = submit;
  $("cpn2").onkeydown = (e) => { if (e.key === "Enter") submit(); };
}
async function signOut() {
  // Revoke the session SERVER-SIDE (POST /api/logout), not just locally — otherwise the bearer token
  // stays valid for its full 30-day TTL and a "sign out" on a shared/lost device ends nothing.
  // Best-effort: clear local state regardless of the network result so the UI always returns to login.
  try { if (token) await api("POST", "/api/logout"); } catch { /* revoke is best-effort */ }
  token = ""; me = null; sessionStorage.removeItem("selfsync_admin_token"); render();
}

async function loginView() {
  $("who").textContent = "";
  // AC.3.1.9: show the operator's system-use / consent banner (if configured) BEFORE credential entry.
  let banner = "";
  try { const h = await (await fetch("/health")).json(); banner = (h && typeof h.banner === "string") ? h.banner : ""; } catch { /* offline; skip */ }
  const bannerHtml = banner
    ? `<div class="panel" style="max-width:380px;margin-top:28px;border-color:var(--warn)"><div class="muted" style="white-space:pre-wrap;color:var(--ink)">${esc(banner)}</div></div>`
    : "";
  $("app").innerHTML = bannerHtml + `
    <div class="panel" style="max-width:380px;margin-top:12px;">
      <h2 style="margin-top:0">Sign in</h2>
      <div class="row"><input id="u" placeholder="username" autofocus /></div>
      <div class="row" style="margin-top:8px"><input id="p" type="password" placeholder="password" /></div>
      <div class="row" id="mfarow" style="margin-top:8px;display:none"><input id="mfa" inputmode="numeric" placeholder="authenticator code (or recovery code)" style="flex:1" /></div>
      <div class="row" style="margin-top:12px"><button id="go">Sign in</button></div>
    </div>`;
  const submit = async () => {
    try {
      setMsg("");
      await login($("u").value.trim(), $("p").value, $("mfa").value.trim() || undefined);
    } catch (e) {
      // IA.3.5.3: the account has MFA — reveal the code field and ask for the second factor.
      if (String(e.message).includes("mfa required")) {
        $("mfarow").style.display = "";
        $("mfa").focus();
        setMsg("Enter your authenticator code to finish signing in.", "");
      } else {
        setMsg("Sign in failed.", "err");
      }
    }
  };
  $("go").onclick = submit;
  $("p").onkeydown = (e) => { if (e.key === "Enter") submit(); };
  $("mfa").onkeydown = (e) => { if (e.key === "Enter") submit(); };
}

async function dashboard() {
  $("who").innerHTML = `signed in as <strong>${esc(me.username)}</strong>${me.is_server_admin ? '<span class="badge">server-admin</span>' : ''} · <a href="#" id="out">sign out</a>`;
  $("out").onclick = (e) => { e.preventDefault(); signOut(); };

  let html = `<h2>Two-factor authentication</h2><div class="panel" id="mfa"><div class="empty">Loading…</div></div>`;
  html += `<h2>My vaults</h2><div class="panel" id="vaults"><div class="empty">Loading…</div></div>`;
  html += `<h2>Sharing</h2><div class="panel" id="sharing"><div class="empty">Loading…</div></div>`;
  if (me.is_server_admin) {
    html += `<h2>Accounts</h2><div class="panel" id="users"><div class="empty">Loading…</div></div>`;
    html += `<h2>Registration</h2><div class="panel" id="reg"><div class="empty">Loading…</div></div>`;
    html += `<h2>Invite tokens</h2><div class="panel" id="invites"><div class="empty">Loading…</div></div>`;
  }
  $("app").innerHTML = html;
  await renderMfa();
  await renderVaults();
  await renderSharing();
  if (me.is_server_admin) { await renderUsers(); await renderReg(); await renderInvites(); }
}

// IA.3.5.3: self-service TOTP MFA for THIS account — enable (with recovery codes) or disable.
async function renderMfa(appendHtml) {
  const box = $("mfa");
  let st;
  try { st = await api("GET", "/api/mfa/status"); } catch (e) { box.innerHTML = `<div class="msg err">Couldn't load MFA status.</div>`; return; }
  if (st.enabled) {
    box.innerHTML = `<div class="card-title"><div>Authenticator app <span class="perm read">ENABLED</span>
        <div class="muted" style="font-size:13px">A 6-digit code from your authenticator is required at sign-in.</div></div></div>
      <div class="row" style="margin-top:8px">
        <input id="mfaoff" inputmode="numeric" placeholder="current code to disable" style="flex:1;min-width:160px" />
        <button class="danger" id="mfadis">Disable MFA</button>
      </div>` + (appendHtml || "");
    $("mfadis").onclick = async () => {
      const code = $("mfaoff").value.trim();
      if (!code) { setMsg("Enter your current authenticator (or recovery) code to disable MFA.", "err"); return; }
      try { await api("POST", "/api/mfa/disable", { code }); await renderMfa(); setMsg("MFA disabled.", "ok"); }
      catch (e) { setMsg("Disable failed: " + e.message, "err"); }
    };
  } else {
    box.innerHTML = `<div class="muted" style="font-size:13px">Add a second factor (TOTP). Recommended for admin accounts.</div>
      <div class="row" style="margin-top:8px"><button id="mfaen">Enable MFA</button></div>
      <div id="mfaenroll"></div>`;
    $("mfaen").onclick = async () => {
      try {
        const en = await api("POST", "/api/mfa/enroll");
        $("mfaenroll").innerHTML = `
          <div class="muted" style="font-size:13px;margin-top:10px">1) Add this to your authenticator app (Google Authenticator, Aegis, 1Password…). Enter the secret manually or use the otpauth URI:</div>
          <div class="token">${esc(en.secret)}</div>
          <div class="muted" style="font-size:12px;margin-top:4px;word-break:break-all">${esc(en.otpauth)}</div>
          <div class="row" style="margin-top:10px">
            <input id="mfaconf" inputmode="numeric" placeholder="2) enter the 6-digit code to confirm" style="flex:1;min-width:180px" />
            <button id="mfaconfgo">Confirm &amp; enable</button>
          </div><div id="mfacodes"></div>`;
        $("mfaconfgo").onclick = async () => {
          const code = $("mfaconf").value.trim();
          try {
            const r = await api("POST", "/api/mfa/confirm", { code });
            const list = (r.recovery_codes || []).map(c => `<div class="token" style="border-style:solid">${esc(c)}</div>`).join("");
            // Re-read status so the panel reflects the now-ENABLED truth (not the stale enroll view),
            // while KEEPING the one-time recovery codes visible (they're shown exactly once).
            const codesHtml = `<div class="msg ok" style="margin-top:10px">MFA enabled. SAVE these one-time recovery codes now — they're shown once and let you sign in if you lose your authenticator:</div>${list}`;
            await renderMfa(codesHtml);
            setMsg("MFA enabled — save your recovery codes.", "ok");
          } catch (e) { setMsg("Confirm failed: " + e.message, "err"); }
        };
      } catch (e) { setMsg("Couldn't start MFA enrollment: " + e.message, "err"); }
    };
  }
}

// A per-vault health chip: green OK, red needs-repair. Repair (reindex) is offered only when a vault
// is NOT ready — status-driven, so the operator acts on a signal instead of guessing.
function healthChip(status) {
  if (status === "ready") return `<span class="perm read">OK</span>`;
  if (status === "missing") return `<span class="perm">no data yet</span>`;
  return `<span class="perm readWrite">needs repair</span>`;
}

// Compact relative "last used" (D0037). Takes epoch seconds; empty for a vault with no activity yet.
function relTime(secs) {
  if (!secs) return "";
  const d = Math.max(0, Math.floor(Date.now() / 1000) - secs);
  if (d < 60) return "just now";
  if (d < 3600) return `${Math.floor(d / 60)}m ago`;
  if (d < 86400) return `${Math.floor(d / 3600)}h ago`;
  if (d < 2592000) return `${Math.floor(d / 86400)}d ago`;
  return new Date(secs * 1000).toISOString().slice(0, 10);
}

// "My vaults": health + last-used + repair/delete. Sharing lives in its own section (renderSharing).
async function renderVaults() {
  const vaults = await api("GET", "/api/admin/vaults");
  const box = $("vaults");
  if (!vaults.length) { box.innerHTML = `<div class="empty">You own no vaults yet.</div>`; return; }
  let h = "";
  for (const v of vaults) {
    // Repair only for a genuinely degraded vault ("ready"/"missing" show none — chip and action agree).
    const repairBtn = (v.status === "ready" || v.status === "missing") ? "" : `<button style="float:right;margin-right:6px" data-reindex="${esc(v.vault)}">Repair</button>`;
    const used = v.last_used ? `<span class="lastused">last used ${esc(relTime(v.last_used))}</span>` : `<span class="lastused">no activity yet</span>`;
    h += `<div style="margin-bottom:10px"><div class="vault">${esc(v.vault)} ${healthChip(v.status)} ${used}
        <button class="danger" style="float:right" data-delvault="${esc(v.vault)}">Delete vault</button>
        ${repairBtn}</div></div>`;
  }
  box.innerHTML = h;
  // Owner self-service vault delete (D0021) — a typed confirmation guards the destructive action.
  box.querySelectorAll("[data-delvault]").forEach(b => b.onclick = async () => {
    const vault = b.dataset.delvault;
    if (!confirm(`Delete YOUR vault "${vault}"?\n\nThis removes its data on the server. Devices still syncing it will stop until you re-create or switch; their LOCAL files are untouched.`)) return;
    const typed = prompt(`Type the vault name "${vault}" to confirm deletion:`);
    if (typed !== vault) { setMsg("Delete cancelled — the name didn't match.", "err"); return; }
    try { await api("DELETE", "/api/vault", { vault }); await renderVaults(); await renderSharing(); setMsg("Vault deleted.", "ok"); }
    catch (e) { setMsg("Delete failed: " + e.message, "err"); }
  });
  // One-click repair of your OWN vault (D0022) — shown only when the health chip isn't "OK".
  box.querySelectorAll("[data-reindex]").forEach(b => b.onclick = async () => {
    const vault = b.dataset.reindex;
    try { const r = await api("POST", "/api/admin/reindex", { owner: me.username, vault, force: false });
      await renderVaults(); setMsg(`Repaired ${vault} — now at v${r.version}.`, "ok"); }
    catch (e) { setMsg(`Repair failed: ${e.message}. If files are unrecoverable, use Force under Accounts → your account → Vaults.`, "err"); }
  });
}

// D0037: a SINGLE sharing section (not per-vault). Pick a vault + permission → create a single-use
// share LINK to send; whoever redeems it (creating an account or signing in) gains access. Below:
// active (unredeemed) links to revoke, and who each vault is shared with (redeemed grants) to revoke.
// The grantee-username path is gone — links are the canonical way to grant access.
async function renderSharing() {
  const box = $("sharing");
  let vaults, links;
  try {
    [vaults, links] = await Promise.all([
      api("GET", "/api/admin/vaults"),
      api("GET", "/api/share-links"),
    ]);
  } catch (e) { box.innerHTML = `<div class="msg err">Couldn't load sharing: ${esc(e.message)}</div>`; return; }
  if (!vaults.length) { box.innerHTML = `<div class="empty">You own no vaults to share yet.</div>`; return; }

  const vaultOpts = vaults.map(v => `<option value="${esc(v.vault)}">${esc(v.vault)}</option>`).join("");
  // Redeemed grants across all owned vaults — who has access.
  const grants = [];
  for (const v of vaults) for (const g of (v.grants || [])) grants.push({ vault: v.vault, grantee: g.grantee, perm: g.perm });
  const grantRows = grants.length
    ? grants.map(g => `<tr><td class="vault">${esc(g.vault)}</td><td>${esc(g.grantee)}</td>
        <td><span class="perm ${g.perm}">${g.perm}</span></td>
        <td style="text-align:right"><button class="danger" data-revoke="${esc(g.vault)}|${esc(g.grantee)}">Revoke</button></td></tr>`).join("")
    : `<tr><td colspan="4" class="empty">No vault is shared with anyone yet.</td></tr>`;
  // Pending (unredeemed) links.
  const pending = links.filter(l => !l.redeemed_by);
  const linkRows = pending.length
    ? pending.map(l => `<tr><td class="vault">${esc(l.vault)}</td><td><span class="perm ${l.perm}">${l.perm}</span></td>
        <td class="muted">${l.label ? esc(l.label) : ""}${l.expires_at ? "" : " · no expiry"}</td>
        <td style="text-align:right"><button class="danger" data-revlink="${esc(l.id)}">Revoke</button></td></tr>`).join("")
    : `<tr><td colspan="4" class="empty">No active share links.</td></tr>`;

  box.innerHTML = `
    <div class="row">
      <select id="shvault">${vaultOpts}</select>
      <select id="shperm"><option value="read">read-only</option><option value="readWrite">read-write</option></select>
      <button id="shcreate">Create share link</button>
    </div>
    <div id="shnew"></div>
    <div class="muted" style="font-weight:600;margin-top:16px">Active share links</div>
    <table><tr><th>Vault</th><th>Access</th><th>Label</th><th></th></tr>${linkRows}</table>
    <div class="muted" style="font-weight:600;margin-top:16px">Shared with</div>
    <table><tr><th>Vault</th><th>Account</th><th>Access</th><th></th></tr>${grantRows}</table>`;

  $("shcreate").onclick = async () => {
    const vault = $("shvault").value, perm = $("shperm").value;
    try {
      const r = await api("POST", "/api/share-links", { vault, perm });
      const token = r.token;
      // The link carries the server the RECIPIENT's plugin must connect to. We prefill this admin page's
      // origin, but in a split/reverse-proxied deployment that may be the PRIVATE admin address — so it's
      // an EDITABLE field defaulting to location.origin, and the link is (re)assembled from it (critique).
      $("shnew").innerHTML = `
        <div class="muted" style="font-size:12px;margin-top:8px">Public server address the recipient's SelfSync connects to — edit if it differs from this admin page's address:</div>
        <div class="row" style="margin-top:4px"><input id="shserver" value="${esc(location.origin)}" style="flex:1;min-width:220px" /></div>
        <div class="token" id="shlink"></div>
        <div class="row" style="margin-top:6px"><button id="shcopy" class="ghost">Copy link</button>
          <span class="muted" style="font-size:12px">Single-use — the recipient redeems it in SelfSync (creating an account or signing in) to gain access.</span></div>`;
      const build = () => `selfsync-share://redeem?server=${encodeURIComponent($("shserver").value.trim())}&token=${encodeURIComponent(token)}`;
      const paint = () => { $("shlink").textContent = build(); };
      $("shserver").oninput = paint; paint();
      $("shcopy").onclick = async () => { try { await navigator.clipboard.writeText(build()); setMsg("Share link copied.", "ok"); } catch { setMsg("Select the link above and copy it.", ""); } };
      setMsg("Share link created — check the server address, then copy it below.", "ok");
    } catch (e) { setMsg("Couldn't create the link: " + e.message, "err"); }
  };
  box.querySelectorAll("[data-revlink]").forEach(b => b.onclick = async () => {
    try { await api("DELETE", "/api/share-links/" + encodeURIComponent(b.dataset.revlink)); await renderSharing(); setMsg("Share link revoked.", "ok"); }
    catch (e) { setMsg("Revoke failed: " + e.message, "err"); }
  });
  box.querySelectorAll("[data-revoke]").forEach(b => b.onclick = async () => {
    const [vault, grantee] = b.dataset.revoke.split("|");
    try { await api("DELETE", "/api/admin/shares", { vault, grantee }); await renderSharing(); setMsg("Access revoked.", "ok"); }
    catch (e) { setMsg("Revoke failed: " + e.message, "err"); }
  });
}

async function renderUsers() {
  const users = await api("GET", "/api/admin/users"); // [{username, is_admin, is_bootstrap}]
  const box = $("users");
  const rows = users.map(u => {
    const badge = u.is_admin ? ` <span class="perm readWrite">admin</span>` : "";
    let actions;
    if (u.username === me.username) actions = '<span class="muted">you</span>';
    else if (u.is_bootstrap) actions = '<span class="muted">bootstrap admin</span>';
    else actions = `<button data-admin="${esc(u.username)}" data-on="${u.is_admin ? 1 : 0}">${u.is_admin ? "Revoke admin" : "Make admin"}</button>
      <button data-resetpw="${esc(u.username)}">Reset password</button>
      <button class="ghost" data-vaults="${esc(u.username)}">Vaults</button>
      <button class="danger" data-del="${esc(u.username)}">Delete</button>`;
    // A hidden sub-row per account holds its vaults (health + repair/delete) — lazy-loaded on "Vaults".
    return `<tr><td>${esc(u.username)}${badge}</td><td style="text-align:right">${actions}</td></tr>
      <tr class="uvrow" data-uvfor="${esc(u.username)}" style="display:none"><td colspan="2"><div class="empty">Loading…</div></td></tr>`;
  }).join("");
  box.innerHTML = `<table><tr><th>Account</th><th></th></tr>${rows}</table>
    <div class="row" style="margin-top:10px">
      <input id="nu" placeholder="new username" style="flex:1;min-width:140px" />
      <input id="np" type="password" placeholder="password (min 8 chars)" />
      <button id="addu">Create account</button>
    </div>
    <div class="muted" style="font-size:12px;margin-top:4px">Username: lowercase letters, digits, and . _ - + @ (an email address works). Max 64, no spaces or slashes.</div>`;
  $("addu").onclick = async () => {
    try { await api("POST", "/api/admin/users", { username: $("nu").value.trim(), password: $("np").value }); await renderUsers(); setMsg("Account created.", "ok"); }
    catch (e) { setMsg("Create failed: " + e.message, "err"); }
  };
  box.querySelectorAll("[data-admin]").forEach(b => b.onclick = async () => {
    const name = b.dataset.admin, on = b.dataset.on === "1";
    try { await api(on ? "DELETE" : "POST", "/api/admin/users/" + encodeURIComponent(name) + "/admin"); await renderUsers(); setMsg(on ? "Admin revoked." : "Admin granted.", "ok"); }
    catch (e) { setMsg("Admin change failed: " + e.message, "err"); }
  });
  // Operator password reset — replaces destructive delete+recreate for a forgotten password. Also
  // revokes the account's sessions server-side (a reset signs them out everywhere).
  box.querySelectorAll("[data-resetpw]").forEach(b => b.onclick = async () => {
    const name = b.dataset.resetpw;
    const pw = prompt(`Set a new password for "${name}" (min 8 characters). This also signs them out of all devices.`);
    if (pw === null) return;
    try { await api("POST", "/api/admin/users/" + encodeURIComponent(name) + "/password", { password: pw }); setMsg(`Password reset for ${name}; their sessions were revoked.`, "ok"); }
    catch (e) { setMsg("Reset failed: " + e.message, "err"); }
  });
  box.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if (!confirm(`Delete account "${b.dataset.del}"? Their vaults, shares, and admin rights are removed.`)) return;
    try { await api("DELETE", "/api/admin/users/" + encodeURIComponent(b.dataset.del)); await renderUsers(); setMsg("Account deleted.", "ok"); }
    catch (e) { setMsg("Delete failed: " + e.message, "err"); }
  });
  // Expand/collapse an account's vaults; lazy-load their health + repair/delete on first open. This is
  // the folded-in replacement for the old free-text "Vault repair" panel — no typo-prone owner/vault entry.
  box.querySelectorAll("[data-vaults]").forEach(b => b.onclick = async () => {
    const name = b.dataset.vaults;
    const sub = box.querySelector(`.uvrow[data-uvfor="${CSS.escape(name)}"]`);
    if (!sub) return;
    if (sub.style.display !== "none") { sub.style.display = "none"; return; }
    sub.style.display = "";
    const cell = sub.querySelector("td");
    try {
      const vaults = await api("GET", "/api/admin/users/" + encodeURIComponent(name) + "/vaults");
      renderOwnerVaults(name, vaults, cell);
    } catch (e) { cell.innerHTML = `<span class="msg err">Couldn't load vaults: ${esc(e.message)}</span>`; }
  });
}

// Render one account's vaults inside its expanded sub-row: health chip + status-driven Repair (with a
// force option for unrecoverable entries) + Delete. Server-admin only (any owner).
function renderOwnerVaults(name, vaults, cell) {
  if (!vaults.length) { cell.innerHTML = `<div class="empty">No vaults.</div>`; return; }
  // Status-driven Repair (matches the own-vaults panel): only a genuinely degraded vault gets a Repair
  // button + force option. "ready" needs none; "missing" has nothing to repair (reindex 404s on it).
  const repairable = (s) => s !== "ready" && s !== "missing";
  cell.innerHTML = vaults.map(v => `<div class="row" style="margin:5px 0">
      <span class="vault" style="flex:1;min-width:120px">${esc(v.vault)} ${healthChip(v.status)}</span>
      ${repairable(v.status) ? `<label class="inline"><input type="checkbox" class="ovforce" /> force</label>
      <button class="ovreindex">Repair</button>` : ""}
      <button class="danger ovdel">Delete vault</button>
    </div>`).join("");
  // Re-fetch + re-render this sub-row so an action's result is reflected: a repaired vault's health
  // chip updates, a deleted vault's row disappears (no stale "dual truth" left on screen).
  const reload = async () => {
    try { const vs = await api("GET", "/api/admin/users/" + encodeURIComponent(name) + "/vaults"); renderOwnerVaults(name, vs, cell); }
    catch (e) { cell.innerHTML = `<span class="msg err">Couldn't reload vaults: ${esc(e.message)}</span>`; }
  };
  cell.querySelectorAll(".row").forEach((rowEl, i) => {
    const vault = vaults[i].vault;
    const rb = rowEl.querySelector(".ovreindex");
    if (rb) rb.onclick = async () => {
      const force = rowEl.querySelector(".ovforce").checked;
      if (!confirm(`Repair "${name}/${vault}"${force ? " (force — drops unrecoverable entries)" : ""}?`)) return;
      try { const r = await api("POST", "/api/admin/reindex", { owner: name, vault, force }); setMsg(`Repaired ${name}/${vault} — now at v${r.version}.`, "ok"); await reload(); }
      catch (e) { setMsg(`Repair failed: ${e.message}${force ? "" : " — try 'force' if entries are unrecoverable."}`, "err"); }
    };
    rowEl.querySelector(".ovdel").onclick = async () => {
      if (!confirm(`DELETE vault "${name}/${vault}"? This removes all of its data on the server and cannot be undone.`)) return;
      try { await api("DELETE", "/api/admin/vault", { owner: name, vault }); setMsg(`Deleted ${name}/${vault}.`, "ok"); await reload(); }
      catch (e) { setMsg(`Delete failed: ${e.message}`, "err"); }
    };
  });
}

async function renderReg() {
  const r = await api("GET", "/api/admin/registration");
  const open = r.mode === "open";
  $("reg").innerHTML = `<div class="card-title">
      <div>New-account registration
        <div class="muted" style="font-size:13px">${open ? "OPEN — anyone can create an account." : "CLOSED — new accounts need an invite token (below) or a vault share link."}</div></div>
      <div class="row" style="gap:8px;flex:none"><span class="muted">${open ? "Open" : "Closed"}</span>
        <label class="switch"><input type="checkbox" id="regtoggle" ${open ? "checked" : ""} /><span class="slider"></span></label></div>
    </div>`;
  $("regtoggle").onchange = async (e) => {
    const wantOpen = e.target.checked;
    try { await api("PUT", "/api/admin/registration", { mode: wantOpen ? "open" : "closed" }); await renderReg(); await renderInvites(); setMsg("Registration " + (wantOpen ? "opened." : "closed."), "ok"); }
    catch (err) { setMsg("Update failed: " + err.message, "err"); e.target.checked = !wantOpen; }
  };
}

async function renderInvites() {
  const list = await api("GET", "/api/admin/invites");
  const box = $("invites");
  const rows = list.length
    ? list.map(t => `<tr><td>${esc(t.label) || '<span class="muted">—</span>'}</td>
        <td class="muted">${t.expires_at ? "expires" : "no expiry"}</td>
        <td style="text-align:right"><button class="danger" data-inv="${esc(t.id)}">Revoke</button></td></tr>`).join("")
    : `<tr><td colspan="3" class="empty">No outstanding invites.</td></tr>`;
  box.innerHTML = `<table><tr><th>Label</th><th></th><th></th></tr>${rows}</table>
    <div class="row" style="margin-top:10px">
      <input id="il" placeholder="label (e.g. for Dana)" style="flex:1;min-width:160px" />
      <button id="addi">Create invite</button>
    </div><div id="newtok"></div>`;
  $("addi").onclick = async () => {
    try {
      const r = await api("POST", "/api/admin/invites", { label: $("il").value.trim() });
      const invite = r.token;
      // D0037: surface the invite as a copyable ACCOUNT-CREATION LINK (selfsync-invite://) the recipient
      // pastes into SelfSync setup — plus the raw token for manual entry. Editable server address (like
      // share links) so it's correct in split/proxied deploys. We do NOT re-render the panel here (that
      // would wipe the shown link); the new invite appears in the list on the next refresh.
      $("newtok").innerHTML = `
        <div class="muted" style="font-size:12px;margin-top:8px">Account-creation link — the recipient pastes it into SelfSync setup to create an account (works even when registration is closed). Edit the server address if your public URL differs from this admin page:</div>
        <div class="row" style="margin-top:4px"><input id="invserver" value="${esc(location.origin)}" style="flex:1;min-width:220px" /></div>
        <div class="token" id="invlink"></div>
        <div class="row" style="margin-top:6px"><button id="invcopy" class="ghost">Copy link</button>
          <span class="muted" style="font-size:12px">…or share the raw token below for manual entry. Shown once — single-use.</span></div>
        <div class="token" style="border-style:solid">${esc(invite)}</div>`;
      const build = () => `selfsync-invite://register?server=${encodeURIComponent($("invserver").value.trim())}&token=${encodeURIComponent(invite)}`;
      const paint = () => { $("invlink").textContent = build(); };
      $("invserver").oninput = paint; paint();
      $("invcopy").onclick = async () => { try { await navigator.clipboard.writeText(build()); setMsg("Account-creation link copied.", "ok"); } catch { setMsg("Select the link above and copy it.", ""); } };
      setMsg("Invite created — copy the link or token below.", "ok");
    } catch (e) { setMsg("Create failed: " + e.message, "err"); }
  };
  box.querySelectorAll("[data-inv]").forEach(b => b.onclick = async () => {
    try { await api("DELETE", "/api/admin/invites/" + encodeURIComponent(b.dataset.inv)); await renderInvites(); setMsg("Invite revoked.", "ok"); }
    catch (e) { setMsg("Revoke failed: " + e.message, "err"); }
  });
}

async function boot() {
  setMsg("");
  try { me = await api("GET", "/api/admin/me"); await dashboard(); }
  catch (e) { token = ""; sessionStorage.removeItem("selfsync_admin_token"); loginView(); }
}
function render() { if (token) boot(); else loginView(); }
render();
</script>
</body>
</html>
